apiVersion: apps/v1
kind: Deployment
metadata:
  name: smarter-dev-proactive-agent
  namespace: smarter-dev
spec:
  # Start with one replica for the canary. Redis guild leases make it safe to
  # increase this after the first external guild is stable.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: smarter-dev-proactive-agent
  template:
    metadata:
      labels:
        app: smarter-dev-proactive-agent
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: proactive-agent
          image: zzmmrmn/smarter-dev-proactive-agent:<IMAGE_VERSION>
          envFrom:
            - configMapRef:
                name: smarter-dev-config
          env:
            # The agent dreams the guilds it runs, and renders PERSONALITY/BEHAVIOR
            # in its prompt. Set here, not in smarter-dev-config: this deployment
            # is the only reader.
            - name: PROACTIVE_DREAM_ENABLED
              value: "true"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: redis-url
            - name: PROACTIVE_AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: proactive-agent-api-key
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: discord-bot-token
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: gemini-api-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: openai-api-key
            # Direct Claude API for any claude-* model in config.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: anthropic-api-key
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: openrouter-api-key
            - name: OPENCODE_ZEN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: opencode-zen-api-key
            - name: BRAVE_SEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: brave-search-api-key
            # Phase 1 of the key obfuscation (smarter-dev #482): each secret
            # also lives under an opaque key, its env var the uppercase of that
            # key, holding the v1-encoded value. optional so a pod starts before
            # the secret has them; the plain names above stay until phase 2.
            - name: FUC9HA
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: fuc9ha
                  optional: true
            - name: FHI1OT
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: fhi1ot
                  optional: true
            - name: IN8OID
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: in8oid
                  optional: true
            - name: IRBCKR
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: irbckr
                  optional: true
            - name: KMSVP8
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: kmsvp8
                  optional: true
            - name: RCGW3A
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: rcgw3a
                  optional: true
            - name: AO6HUE
              valueFrom:
                secretKeyRef:
                  name: smarter-dev-secrets
                  key: ao6hue
                  optional: true
          ports:
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
