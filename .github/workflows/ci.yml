name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --frozen --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q
      - run: docker build -t proactive-agent:test .

  deploy-production:
    name: Deploy to DigitalOcean Kubernetes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only files copied by the Dockerfile shape the image. Documentation,
      # tests, contracts, workflow, and manifest-only changes reuse the last
      # image tag; kubectl still applies any manifest change.
      - name: Compute image tag from build inputs
        run: |
          IMAGE_TAG=$(git log -1 --format=%h --abbrev=7 -- \
            Dockerfile .dockerignore pyproject.toml uv.lock src)
          if [ -z "$IMAGE_TAG" ]; then
            echo "::error::no commit found touching image build inputs"
            exit 1
          fi
          echo "image tag: $IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: |
          doctl kubernetes cluster kubeconfig save production-hosting
          kubectl config set-context --current --namespace=smarter-dev

      - name: Log Docker in
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image if inputs changed
        run: |
          IMAGE=zzmmrmn/smarter-dev-proactive-agent:${IMAGE_TAG}
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "$IMAGE already exists; skipping build"
          else
            docker buildx build --push \
              --cache-from type=registry,ref=zzmmrmn/smarter-dev-proactive-agent:buildcache \
              --cache-to type=registry,ref=zzmmrmn/smarter-dev-proactive-agent:buildcache,mode=max \
              -t "$IMAGE" .
          fi

      - name: Deploy and verify worker
        run: |
          sed -i "s|<IMAGE_VERSION>|${IMAGE_TAG}|" deploy/kubernetes.yaml
          kubectl apply -f deploy/kubernetes.yaml
          kubectl rollout status deployment/smarter-dev-proactive-agent --timeout=5m
