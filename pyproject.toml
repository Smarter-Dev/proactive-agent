[project]
name = "smarter-dev-proactive-agent"
version = "0.1.0"
description = "Guild-isolated proactive Discord agent worker"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "google-genai>=1.62.0",
    "pydantic-monty>=0.0.18",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "redis>=6.2.0",
    "pydantic-ai-slim[anthropic,google,openai]>=1.89.1,<2.0.0",
    "pdfplumber>=0.11.0",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.37.0",
    "jsonschema>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.0",
]

[project.scripts]
proactive-agent = "proactive_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proactive_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["proactive_agent"]
